<!doctype html><html lang="en"><head><meta charset="UTF-8"/><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><link rel="apple-touch-icon" href="/apple-touch-icon.png"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e14"/><meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="Workout"/><meta name="format-detection" content="telephone=no"/><meta name="description" content="Workout: your training, moving forward. Plan workouts, log every set, and follow your strength progress. Works offline."/><script>(()=>{let theme='dark';try{const saved=localStorage.getItem('workout-theme');if(saved==='light'||saved==='dark')theme=saved}catch{}document.documentElement.dataset.theme=theme;const metas=[...document.querySelectorAll('meta[name="theme-color"]')];if(metas[0]){metas[0].removeAttribute('media');metas[0].setAttribute('content',theme==='light'?'#f8fafc':'#0b0e14');metas.slice(1).forEach(meta=>meta.remove())}})()</script><title>Workout</title></head><body><div id="root"></div><noscript>Workout needs JavaScript to run.</noscript><script type="module" src="/src/main.tsx"></script></body></html>
