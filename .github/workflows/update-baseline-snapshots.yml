name: Update baseline snapshots

# Pixel baselines must be rendered on the same Linux runner CI compares them on; a Windows or
# macOS machine draws text differently. Run this after a deliberate shell or skeleton design change,
# download the artifact, and commit the -linux.png files it contains.
on:
  workflow_dispatch:
  # A push to this branch renders them too, before the workflow exists on the default branch.
  push:
    branches: [snapshots/baseline]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chrome
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright test tests/baseline.spec.ts --project=baseline-phone --project=baseline-desktop --update-snapshots
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-linux-snapshots
          path: web/tests/baseline.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
