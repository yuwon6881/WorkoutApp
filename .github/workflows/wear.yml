name: Wear OS

on:
  # Every branch, so a Wear change is tested and rendered before it reaches master.
  push:
    paths: ['wear/**', '.github/workflows/wear.yml']
  pull_request:
    branches: [master]
    paths: ['wear/**', '.github/workflows/wear.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests include the Robolectric screen renders: every screen state on small round, large
  # round and square watches (and large text), masked to the physical face. The PNGs are the review surface.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, render screens and build the debug APK
        run: gradle --no-daemon -p wear :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wear-unit-reports
          path: |
            wear/app/build/reports/tests
            wear/app/build/wear-shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wear-debug-apk
          path: wear/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Boots a Wear OS virtual device per face shape, installs the same APK and checks it launches
  # without a crash, keeping a screenshot of the first screen.
  emulator:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [wearos_small_round, wearos_large_round, wearos_square]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@v4
        with:
          name: wear-debug-apk
          path: wear-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash wear/scripts/emulator-smoke.sh wear-apk/app-debug.apk wear-emulator/${{ matrix.profile }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wear-emulator-${{ matrix.profile }}
          path: wear-emulator
