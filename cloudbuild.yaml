  _FITNESS_ACCOUNT_ISSUER: 'https://fitness-account-i47taxhzba-as.a.run.app'
  _WORKOUT_REDIRECT_URI: 'https://workout-one-mocha.vercel.app/api/auth/central/callback'
  _GOOGLE_HEALTH_CLIENT_ID: '396431756440-f05klmtoc05mktbgk39i5jbfqgd0sn03.apps.googleusercontent.com'
  _NUTRITION_CONTEXT_URL: 'https://nutrition-api-396431756440.asia-southeast1.run.app/api/integrations/v1/training-context'
  _WORKOUT_API_ORIGIN: 'https://workout-api-i47taxhzba-as.a.run.app'
