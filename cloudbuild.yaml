steps:
  # 1. Build and push the container image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workout-api"
        docker build \
          -t "$$IMAGE:$COMMIT_SHA" \
          -t "$$IMAGE:latest" \
          -f Dockerfile .
        docker push "$$IMAGE:latest"
        docker push "$$IMAGE:$COMMIT_SHA"
    id: BuildPush

  # Migrations and the catalog are explicit one-shot jobs. The serving revision never performs
  # schema work on startup, and existing rows receive the current bodyweight load models here.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'workout-migrate'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workout-api:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--service-account=workout-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--command=dotnet'
      - '--args=Workout.Api.dll,--migrate-only'
      - '--set-env-vars=PublicOrigin=${_PUBLIC_ORIGIN},Database__MigrateOnStartup=false,Identity__Authority=${_FITNESS_ACCOUNT_AUTHORITY},Identity__Issuer=${_FITNESS_ACCOUNT_ISSUER},Identity__WorkoutAudience=workout-api,Identity__NutritionAudience=nutrition-api,Integrations__KmsKeyName=${_INTEGRATION_KMS_KEY}'
      - '--set-secrets=ConnectionStrings__Database=workout-neon-database:latest,Identity__ClientSecret=fitness-workout-client-secret:latest'
    id: Migrate
    waitFor: [BuildPush]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'workout-migrate'
      - '--region=asia-southeast1'
      - '--wait'
    id: MigrateExecute
    waitFor: [Migrate]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'workout-seed-catalog'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workout-api:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--service-account=workout-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--command=dotnet'
      - '--args=Workout.Api.dll,--seed-exercises=/app/deploy/exercises.json'
      - '--set-env-vars=PublicOrigin=${_PUBLIC_ORIGIN},Database__MigrateOnStartup=false'
      - '--set-secrets=ConnectionStrings__Database=workout-neon-database:latest'
    id: SeedCatalog
    waitFor: [MigrateExecute]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'workout-seed-catalog'
      - '--region=asia-southeast1'
      - '--wait'
    id: SeedCatalogExecute
    waitFor: [SeedCatalog]

  # 2. Deploy to Cloud Run. _PUBLIC_ORIGIN must be the exact Vercel production HTTPS origin,
  #    without a trailing slash: it is what the cookie and CSRF origin checks compare against.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'workout-api'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workout-api:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=180'
      - '--concurrency=20'
      - '--service-account=workout-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars=PublicOrigin=${_PUBLIC_ORIGIN},Auth__MaxUsers=2,Auth__LegacyEnabled=false,Database__MigrateOnStartup=false,Identity__Authority=${_FITNESS_ACCOUNT_AUTHORITY},Identity__Issuer=${_FITNESS_ACCOUNT_ISSUER},Identity__ClientId=workout-api,Identity__RedirectUri=${_WORKOUT_REDIRECT_URI},Identity__ReturnUrl=/,Identity__ConnectReturnUrl=/settings,Identity__WorkoutAudience=workout-api,Identity__NutritionAudience=nutrition-api,Integrations__NutritionTrainingContextUrl=${_NUTRITION_CONTEXT_URL},Integrations__KmsKeyName=${_INTEGRATION_KMS_KEY},OpenAi__Model=gpt-5.4-mini'
      - '--set-secrets=ConnectionStrings__Database=workout-neon-database:latest,Identity__ClientSecret=fitness-workout-client-secret:latest,Identity__AttachToken=identity-attach-token:latest,OpenAi__ApiKey=financialapp-openai-api-key:latest'
    id: Deploy
    waitFor:
      - SeedCatalogExecute

substitutions:
  _PUBLIC_ORIGIN: 'https://example.invalid'
  _FITNESS_ACCOUNT_AUTHORITY: 'https://fitness-account.example.invalid'
  _FITNESS_ACCOUNT_ISSUER: 'https://fitness-account.example.invalid'
  _WORKOUT_REDIRECT_URI: 'https://workout-api.example.invalid/api/auth/central/callback'
  _NUTRITION_CONTEXT_URL: 'https://nutrition-api.example.invalid/api/integrations/v1/training-context'
  _INTEGRATION_KMS_KEY: 'projects/example/locations/asia-southeast1/keyRings/fitness/cryptoKeys/integration-tokens'

options:
  logging: CLOUD_LOGGING_ONLY
