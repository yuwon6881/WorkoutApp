steps:
  # 1. Build and push the container image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workout-api"
        # Deploy by $BUILD_ID: it is always defined, whereas $COMMIT_SHA is empty for manually
        # triggered builds. The commit tag is added alongside it whenever there is one, so an image
        # can still be traced back to its source revision.
        docker build \
          -t "$$IMAGE:$BUILD_ID" \
          -t "$$IMAGE:latest" \
          -f Dockerfile .
        if [ -n "$COMMIT_SHA" ]; then
          docker tag "$$IMAGE:$BUILD_ID" "$$IMAGE:$COMMIT_SHA"
          docker push "$$IMAGE:$COMMIT_SHA"
        fi
        docker push "$$IMAGE:latest"
        docker push "$$IMAGE:$BUILD_ID"
    id: BuildPush

  # Migrations and the catalog are explicit one-shot jobs. The serving revision never performs
  # schema work on startup, and existing rows receive the current bodyweight load models here.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'workout-migrate'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workout-api:$BUILD_ID'
      - '--region=asia-southeast1'
      - '--service-account=workout-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--command=dotnet'
      - '--args=Workout.Api.dll,--migrate-only'
      - '--set-env-vars=PublicOrigin=${_PUBLIC_ORIGIN},Database__MigrateOnStartup=false,Identity__Authority=${_FITNESS_ACCOUNT_AUTHORITY},Identity__Issuer=${_FITNESS_ACCOUNT_ISSUER},Identity__WorkoutAudience=workout-api,Identity__NutritionAudience=nutrition-api,Integrations__KmsKeyName=projects/$PROJECT_ID/locations/asia-southeast1/keyRings/fitness/cryptoKeys/integration-tokens'
      - '--set-secrets=ConnectionStrings__Database=workout-neon-database:${_WORKOUT_DATABASE_SECRET_VERSION},Identity__ClientSecret=fitness-workout-client-secret:latest'
    id: Migrate
    waitFor: [BuildPush]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'workout-migrate'
      - '--region=asia-southeast1'
      - '--wait'
    id: MigrateExecute
    waitFor: [Migrate]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'workout-seed-catalog'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workout-api:$BUILD_ID'
      - '--region=asia-southeast1'
      - '--service-account=workout-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--command=dotnet'
      - '--args=Workout.Api.dll,--seed-exercises=/app/deploy/exercises.json'
      - '--set-env-vars=PublicOrigin=${_PUBLIC_ORIGIN},Database__MigrateOnStartup=false'
      - '--set-secrets=ConnectionStrings__Database=workout-neon-database:${_WORKOUT_DATABASE_SECRET_VERSION}'
    id: SeedCatalog
    waitFor: [MigrateExecute]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'workout-seed-catalog'
      - '--region=asia-southeast1'
      - '--wait'
    id: SeedCatalogExecute
    waitFor: [SeedCatalog]

  # 2. Deploy to Cloud Run. _PUBLIC_ORIGIN must be the exact Vercel production HTTPS origin,
  #    without a trailing slash: it is what the cookie and CSRF origin checks compare against.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'workout-api'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workout-api:$BUILD_ID'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--no-use-http2'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--timeout=3600'
      # An import's status poll runs every two seconds while the background pass works. At a
      # concurrency of one those polls queue behind each other and behind every other call for the
      # account; a few slots on the same single instance removes that head-of-line blocking without
      # changing the billing shape.
      - '--concurrency=4'
      - '--service-account=workout-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars=PublicOrigin=${_PUBLIC_ORIGIN},Auth__MaxUsers=2,Database__MigrateOnStartup=false,Identity__Authority=${_FITNESS_ACCOUNT_AUTHORITY},Identity__Issuer=${_FITNESS_ACCOUNT_ISSUER},Identity__ClientId=workout-api,Identity__RedirectUri=${_WORKOUT_REDIRECT_URI},Identity__ReturnUrl=/,Identity__ConnectReturnUrl=/settings,Identity__WorkoutAudience=workout-api,Identity__NutritionAudience=nutrition-api,Integrations__NutritionTrainingContextUrl=${_NUTRITION_CONTEXT_URL},Integrations__KmsKeyName=projects/$PROJECT_ID/locations/asia-southeast1/keyRings/fitness/cryptoKeys/integration-tokens,GoogleHealth__ClientId=${_GOOGLE_HEALTH_CLIENT_ID},OpenAi__Model=gpt-5.4-mini,OpenAi__MaxConcurrentChunks=8,OpenAi__ReasoningEffort=low,CloudTasks__ProjectId=$PROJECT_ID,CloudTasks__Location=asia-southeast1,CloudTasks__Queue=workout-rest-alerts,CloudTasks__TargetUrl=${_WORKOUT_API_ORIGIN}/internal/rest-alerts/dispatch,CloudTasks__CallerServiceAccountEmail=${_REST_TASK_SERVICE_ACCOUNT},CloudTasks__Audience=${_WORKOUT_API_ORIGIN},Fcm__ProjectId=${_FIREBASE_PROJECT_ID}'
      - '--set-secrets=ConnectionStrings__Database=workout-neon-database:${_WORKOUT_DATABASE_SECRET_VERSION},Identity__ClientSecret=fitness-workout-client-secret:latest,GoogleHealth__ClientSecret=google-health-client-secret:latest,OpenAi__ApiKey=financialapp-openai-api-key:latest,Maintenance__Secret=workout-maintenance-secret:latest'
    id: Deploy
    waitFor:
      - SeedCatalogExecute

